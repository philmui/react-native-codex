<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Props down and events through callbacks</title><desc id="desc">MenuScreen owns menu state. It passes rows to MenuList and a callback to Composer. Composer calls that callback; the parent updates state and renders again.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><rect x="245" y="20" width="270" height="75" rx="15" fill="#6c36ba"/><text x="380.0" y="52.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">MenuScreen</text><text x="380.0" y="78.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">owns menu and setMenu</text><path d="M275 100 L150 175" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="140" y="128" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">onAdd prop</text><path d="M480 100 L610 175" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="610" y="127" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">menu prop</text><rect x="35" y="185" width="235" height="75" rx="15" fill="#ba215a"/><text x="152.5" y="217.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Composer</text><text x="152.5" y="243.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">calls onAdd(newItem)</text><rect x="490" y="185" width="235" height="75" rx="15" fill="#087c78"/><text x="607.5" y="217.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">MenuList</text><text x="607.5" y="243.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">renders the new menu</text><path d="M275 222 L360 100" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="7 5"/><text x="377" y="216" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">event</text><text x="380" y="288" font-size="17" fill="#172540" text-anchor="middle" font-weight="600">The child requests a change. The parent owns the update.</text></g></svg>
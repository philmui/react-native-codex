<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Two return paths</title><desc id="desc">An expression body returns its result. A block body needs an explicit return. A block without return yields undefined.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="22" fill="#172540" text-anchor="middle" font-weight="600">Two arrow bodies. One intended result.</text><rect x="30" y="70" width="310" height="65" rx="15" fill="#2455cf"/><text x="185.0" y="97.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">x =&gt; x * 2</text><text x="185.0" y="123.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">expression body</text><path d="M345 103 L425 103" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="440" y="70" width="280" height="65" rx="15" fill="#087c78"/><text x="580.0" y="97.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">returns x * 2</text><text x="580.0" y="123.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">implicit return</text><rect x="30" y="155" width="310" height="65" rx="15" fill="#6c36ba"/><text x="185.0" y="182.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">x =&gt; { return x * 2; }</text><text x="185.0" y="208.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">block body</text><path d="M345 187 L425 187" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="440" y="155" width="280" height="65" rx="15" fill="#087c78"/><text x="580.0" y="182.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">returns x * 2</text><text x="580.0" y="208.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">explicit return</text><text x="380" y="268" font-size="17" fill="#9c2347" text-anchor="middle" font-weight="600">x =&gt; { x * 2; } calculates a value, then returns undefined.</text></g></svg>
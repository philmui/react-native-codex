<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Imports connect modules</title><desc id="desc">A default export is imported without braces and may be renamed. A named export is imported with braces and its exported name, unless aliased.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="23" fill="#172540" text-anchor="middle" font-weight="600">Match the import to the export</text><rect x="25" y="80" width="310" height="65" rx="15" fill="#2455cf"/><text x="180.0" y="107.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">export default ItemCard</text><text x="180.0" y="133.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">one default export per module</text><path d="M340 112 L395 112" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="410" y="80" width="325" height="65" rx="15" fill="#087c78"/><text x="572.5" y="118.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">import Card from &#x27;./ItemCard&#x27;</text><rect x="25" y="175" width="310" height="65" rx="15" fill="#6c36ba"/><text x="180.0" y="202.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">export const initialMenu = []</text><text x="180.0" y="228.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">named export</text><path d="M340 207 L395 207" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="410" y="175" width="325" height="65" rx="15" fill="#087c78"/><text x="572.5" y="213.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">import { initialMenu } from &#x27;./data&#x27;</text><text x="380" y="279" font-size="17" fill="#172540" text-anchor="middle" font-weight="600">First classify the error: syntax, type, behavior, or layout.</text></g></svg>
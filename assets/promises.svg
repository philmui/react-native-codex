<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Promise settlement</title><desc id="desc">An operation starts pending and eventually fulfills with a value or rejects with an error. Then handles fulfillment; catch handles rejection.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="23" fill="#172540" text-anchor="middle" font-weight="600">A Promise represents a future outcome</text><rect x="30" y="110" width="190" height="80" rx="15" fill="#6c36ba"/><text x="125.0" y="145.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">Pending</text><text x="125.0" y="171.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">the operation is unfinished</text><path d="M225 134 L370 90" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M225 166 L370 230" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="390" y="55" width="330" height="70" rx="15" fill="#087c78"/><text x="555.0" y="85.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">Fulfilled → .then(value =&gt; …)</text><text x="555.0" y="111.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">use the result</text><rect x="390" y="195" width="330" height="70" rx="15" fill="#ba215a"/><text x="555.0" y="225.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">Rejected → .catch(error =&gt; …)</text><text x="555.0" y="251.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">handle the failure</text><text x="160" y="253" font-size="16" fill="#172540" text-anchor="middle" font-weight="600">Continue other work</text><text x="380" y="290" font-size="15" fill="#172540" text-anchor="middle" font-weight="400">Attaching a callback does not make the Promise finish immediately.</text></g></svg>
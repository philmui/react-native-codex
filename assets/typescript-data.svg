<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Types describe values</title><desc id="desc">The MenuItem type describes an object. An array contains several objects. Type checking happens before runtime.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="22" fill="#172540" text-anchor="middle" font-weight="600">Describe the shape, then let inference help</text><rect x="25" y="80" width="210" height="100" rx="15" fill="#6c36ba"/><text x="130.0" y="125.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">MenuItem</text><text x="130.0" y="151.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">name: string • popular: boolean</text><path d="M245 130 L300 130" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="310" y="80" width="200" height="100" rx="15" fill="#2455cf"/><text x="410.0" y="125.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">One item</text><text x="410.0" y="151.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">{ name: &quot;Tea&quot;, popular: true }</text><path d="M520 130 L565 130" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="575" y="80" width="160" height="100" rx="15" fill="#087c78"/><text x="655.0" y="125.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">MenuItem[]</text><text x="655.0" y="151.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">[ tea, toast ]</text><text x="380" y="235" font-size="18" fill="#172540" text-anchor="middle" font-weight="600">TypeScript checks code. JavaScript runs the app.</text><text x="380" y="265" font-size="15" fill="#172540" text-anchor="middle" font-weight="400">Types do not validate a server response at runtime.</text></g></svg>
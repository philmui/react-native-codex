<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Copy then update</title><desc id="desc">The old array holds Tea and Toast. A new array holds the old entries plus Soup. The outer array is new; unchanged objects can be shared.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="22" fill="#172540" text-anchor="middle" font-weight="600">Create a new array. Keep the old one intact.</text><text x="130" y="78" font-size="16" fill="#172540" text-anchor="middle" font-weight="600">previous array</text><rect x="30" y="100" width="100" height="65" rx="15" fill="#2455cf"/><text x="80.0" y="138.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Tea</text><rect x="145" y="100" width="100" height="65" rx="15" fill="#2455cf"/><text x="195.0" y="138.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Toast</text><path d="M260 133 L390 133" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="325" y="112" font-size="17" fill="#172540" text-anchor="middle" font-weight="600">...prev</text><text x="565" y="78" font-size="16" fill="#172540" text-anchor="middle" font-weight="600">new array</text><rect x="410" y="100" width="100" height="65" rx="15" fill="#2455cf"/><text x="460.0" y="138.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Tea</text><rect x="525" y="100" width="100" height="65" rx="15" fill="#2455cf"/><text x="575.0" y="138.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Toast</text><rect x="640" y="100" width="100" height="65" rx="15" fill="#ba215a"/><text x="690.0" y="138.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Soup</text><text x="380" y="222" font-size="22" fill="#172540" text-anchor="middle" font-weight="600">setMenu(prev =&gt; [...prev, newItem])</text><text x="380" y="263" font-size="15" fill="#172540" text-anchor="middle" font-weight="400">A shallow copy shares unchanged objects; copy an object before editing it.</text></g></svg>
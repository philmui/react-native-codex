<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">A component tree</title><desc id="desc">MenuScreen contains a title, a composer, and a list. The list has two ItemCard components. Props specialize reusable components.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><rect x="255" y="20" width="250" height="62" rx="15" fill="#6c36ba"/><text x="380.0" y="46.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">MenuScreen</text><text x="380.0" y="72.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">one parent component</text><path d="M300 85 L145 130" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M380 85 L380 130" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M460 85 L615 130" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="45" y="140" width="200" height="60" rx="15" fill="#2455cf"/><text x="145.0" y="165.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">Text</text><text x="145.0" y="191.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">screen title</text><rect x="280" y="140" width="200" height="60" rx="15" fill="#ba215a"/><text x="380.0" y="165.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">Composer</text><text x="380.0" y="191.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">name + Add button</text><rect x="520" y="140" width="200" height="60" rx="15" fill="#087c78"/><text x="620.0" y="165.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">ScrollView</text><text x="620.0" y="191.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">list container</text><path d="M580 203 L530 238" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M655 203 L665 238" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="445" y="244" width="145" height="42" rx="15" fill="#087c78"/><text x="517.5" y="271.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">ItemCard</text><rect x="610" y="244" width="130" height="42" rx="15" fill="#087c78"/><text x="675.0" y="271.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">ItemCard</text></g></svg>
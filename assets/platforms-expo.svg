<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Shared code and platform checks</title><desc id="desc">Shared TypeScript logic and React components can target iOS, Android, and web. Platform-specific behavior and testing remain necessary.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="23" fill="#172540" text-anchor="middle" font-weight="600">Share the code. Check each platform.</text><rect x="160" y="60" width="440" height="70" rx="15" fill="#6c36ba"/><text x="380.0" y="90.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">TypeScript + React components</text><text x="380.0" y="116.0" font-size="13" fill="white" text-anchor="middle" font-weight="400">Expo provides development tooling and libraries</text><path d="M245 135 L135 185" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M380 135 L380 185" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M515 135 L625 185" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="35" y="195" width="200" height="65" rx="15" fill="#2455cf"/><text x="135.0" y="222.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">iOS</text><text x="135.0" y="248.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">native controls</text><rect x="280" y="195" width="200" height="65" rx="15" fill="#087c78"/><text x="380.0" y="222.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Android</text><text x="380.0" y="248.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">native controls</text><rect x="525" y="195" width="200" height="65" rx="15" fill="#ba215a"/><text x="625.0" y="222.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Web</text><text x="625.0" y="248.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">browser rendering</text><text x="380" y="289" font-size="15" fill="#172540" text-anchor="middle" font-weight="400">Verify keyboard, touch targets, safe areas, fonts, and scrolling.</text></g></svg>
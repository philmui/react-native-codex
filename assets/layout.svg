<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Flexbox main and cross axes</title><desc id="desc">In a column, main axis points down and cross axis points across. In a row, main points across and cross points down. Justify content follows main; align items follows cross.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="30" font-size="22" fill="#172540" text-anchor="middle" font-weight="600">Change direction → change the axes</text><text x="175" y="65" font-size="17" fill="#172540" text-anchor="middle" font-weight="600">flexDirection: column</text><text x="565" y="65" font-size="17" fill="#172540" text-anchor="middle" font-weight="600">flexDirection: row</text><rect x="60" y="85" width="240" height="150" rx="14" fill="#e0d4f6"/><rect x="430" y="85" width="280" height="150" rx="14" fill="#d2eee9"/><rect x="120" y="97" width="120" height="35" rx="15" fill="#6c36ba"/><text x="180.0" y="120.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">1</text><rect x="120" y="141" width="120" height="35" rx="15" fill="#6c36ba"/><text x="180.0" y="164.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">2</text><rect x="120" y="185" width="120" height="35" rx="15" fill="#6c36ba"/><text x="180.0" y="208.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">3</text><rect x="444" y="130" width="75" height="60" rx="15" fill="#087c78"/><text x="481.5" y="166.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">1</text><rect x="531" y="130" width="75" height="60" rx="15" fill="#087c78"/><text x="568.5" y="166.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">2</text><rect x="618" y="130" width="75" height="60" rx="15" fill="#087c78"/><text x="655.5" y="166.0" font-size="18" fill="white" text-anchor="middle" font-weight="600">3</text><path d="M40 88 L40 233" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="35" y="259" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">main ↓</text><path d="M60 252 L300 252" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="190" y="280" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">cross →</text><path d="M430 252 L710 252" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="565" y="280" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">main →</text><path d="M735 88 L735 233" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="700" y="65" font-size="13" fill="#172540" text-anchor="middle" font-weight="600">cross ↓</text></g></svg>
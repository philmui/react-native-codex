<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Map transforms each element</title><desc id="desc">Three data items are each passed to a callback and become three elements. Each rendered sibling needs a stable key.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="34" font-size="23" fill="#172540" text-anchor="middle" font-weight="600">One callback call per item</text><rect x="25" y="60" width="170" height="53" rx="15" fill="#2455cf"/><text x="110.0" y="92.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Tea · id a</text><path d="M200 86 L280 86" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="290" y="60" width="185" height="53" rx="15" fill="#6c36ba"/><text x="382.5" y="92.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">item =&gt; &lt;Card /&gt;</text><path d="M480 86 L550 86" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="560" y="60" width="175" height="53" rx="15" fill="#087c78"/><text x="647.5" y="92.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Card key=&quot;a&quot;</text><rect x="25" y="133" width="170" height="53" rx="15" fill="#2455cf"/><text x="110.0" y="165.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Toast · id b</text><path d="M200 159 L280 159" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="290" y="133" width="185" height="53" rx="15" fill="#6c36ba"/><text x="382.5" y="165.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">item =&gt; &lt;Card /&gt;</text><path d="M480 159 L550 159" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="560" y="133" width="175" height="53" rx="15" fill="#087c78"/><text x="647.5" y="165.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Card key=&quot;b&quot;</text><rect x="25" y="206" width="170" height="53" rx="15" fill="#2455cf"/><text x="110.0" y="238.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Soup · id c</text><path d="M200 232 L280 232" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="290" y="206" width="185" height="53" rx="15" fill="#6c36ba"/><text x="382.5" y="238.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">item =&gt; &lt;Card /&gt;</text><path d="M480 232 L550 232" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="560" y="206" width="175" height="53" rx="15" fill="#087c78"/><text x="647.5" y="238.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Card key=&quot;c&quot;</text></g></svg>
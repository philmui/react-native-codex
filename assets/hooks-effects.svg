<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Effect lifecycle</title><desc id="desc">After a commit React runs setup. When dependencies change, cleanup runs before the new setup. Unmount also cleans up. Strict Mode can add a development-only setup cleanup setup check.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="32" font-size="22" fill="#172540" text-anchor="middle" font-weight="600">Synchronize with an external system</text><rect x="20" y="95" width="150" height="65" rx="15" fill="#2455cf"/><text x="95.0" y="122.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Commit</text><text x="95.0" y="148.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">updated UI</text><path d="M175 127 L205 127" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="215" y="95" width="150" height="65" rx="15" fill="#087c78"/><text x="290.0" y="122.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Setup</text><text x="290.0" y="148.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">start timer</text><path d="M370 127 L400 127" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="410" y="95" width="150" height="65" rx="15" fill="#ba215a"/><text x="485.0" y="122.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Cleanup</text><text x="485.0" y="148.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">stop old timer</text><path d="M565 127 L595 127" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="605" y="95" width="135" height="65" rx="15" fill="#6c36ba"/><text x="672.5" y="122.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Setup</text><text x="672.5" y="148.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">new dependencies</text><text x="380" y="207" font-size="17" fill="#172540" text-anchor="middle" font-weight="600">Dependency change: cleanup old setup → run new setup</text><text x="380" y="243" font-size="15" fill="#172540" text-anchor="middle" font-weight="600">Unmount: cleanup. Development Strict Mode: extra setup/cleanup check.</text><text x="380" y="275" font-size="16" fill="#172540" text-anchor="middle" font-weight="600">Call hooks at the top level of components or custom hooks.</text></g></svg>
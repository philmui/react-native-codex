<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">State is a render snapshot</title><desc id="desc">The current render reads count zero. Two queued functional increments calculate one then two. A new render receives two.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#53617a"/></marker></defs><rect width="760" height="300" rx="20" fill="#f3f4fb"/><g font-family="Arial, sans-serif"><text x="380" y="35" font-size="23" fill="#172540" text-anchor="middle" font-weight="600">A setter schedules the next render</text><rect x="20" y="90" width="165" height="95" rx="15" fill="#2455cf"/><text x="102.5" y="132.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Render A</text><text x="102.5" y="158.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">count = 0</text><path d="M190 137 L220 137" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="230" y="90" width="145" height="95" rx="15" fill="#6c36ba"/><text x="302.5" y="132.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Updater 1</text><text x="302.5" y="158.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">0 → 1</text><path d="M380 137 L410 137" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="420" y="90" width="145" height="95" rx="15" fill="#ba215a"/><text x="492.5" y="132.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Updater 2</text><text x="492.5" y="158.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">1 → 2</text><path d="M570 137 L600 137" stroke="#53617a" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="610" y="90" width="130" height="95" rx="15" fill="#087c78"/><text x="675.0" y="132.5" font-size="18" fill="white" text-anchor="middle" font-weight="600">Render B</text><text x="675.0" y="158.5" font-size="13" fill="white" text-anchor="middle" font-weight="400">count = 2</text><text x="380" y="235" font-size="19" fill="#172540" text-anchor="middle" font-weight="600">setCount(n =&gt; n + 1); setCount(n =&gt; n + 1);</text><text x="380" y="268" font-size="16" fill="#172540" text-anchor="middle" font-weight="400">The old handler still sees count = 0 until it finishes.</text></g></svg>